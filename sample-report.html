<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Tolaria sample report</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: ui-sans-serif, system-ui, sans-serif;
      }

      body {
        margin: 0;
        padding: 48px;
      }

      main {
        margin: 0 auto;
        max-width: 720px;
      }

      .status {
        border: 1px solid color-mix(in srgb, currentColor 18%, transparent);
        border-radius: 16px;
        margin-top: 24px;
        padding: 24px;
      }
    </style>
  </head>
  <body>
    <main>
      <p>Standalone HTML preview</p>
      <h1>A report can live beside your notes</h1>
      <p>
        Tolaria previews this file in a sanitized frame. Toggle raw mode to edit
        the source, or open it in your browser when it needs interactive code.
      </p>
      <section class="status">
        <strong>Local resource boundary</strong>
        <p>Styles and images can load when their paths stay inside this vault.</p>
      </section>
    </main>
  </body>
</html>
